<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var theme = 'dark'
        try {
          var stored = localStorage.getItem('eo-theme')
          if (stored === 'light' || stored === 'dark') theme = stored
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light'
        } catch (e) {}
        var root = document.documentElement
        root.setAttribute('data-theme', theme)
        root.style.colorScheme = theme
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1f6b45" />
    <meta name="description" content="Enkelt Overblik – fælles portal for bofællesskaber." />
    <meta property="og:title" content="Enkelt Overblik" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="da_DK" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Enkelt Overblik</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
