# /etc/nginx/sites-available/enkeltoverblik-site
# enkeltoverblik.dk + www som statisk site (hhjensen/enkeltoverblik-site).
# admin.enkeltoverblik.dk og mad.bakkefaldet.dk ligger fortsat i "enkeltoverblik".
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name enkeltoverblik.dk www.enkeltoverblik.dk;
    ssl_certificate /etc/letsencrypt/live/enkeltoverblik.dk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enkeltoverblik.dk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/enkeltoverblik-site/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
        try_files $uri /index.html;
    }
}
